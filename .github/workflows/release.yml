# Release images (SPEC §14):
#   push to branch phase-N  -> ghcr.io/<owner>/trustbook:phase-N-rc
#   push of tag    phase-N  -> ghcr.io/<owner>/trustbook:phase-N and :latest
# N is a number, optionally with one letter for a sub-phase: phase-3b (D-092).
# Full image with baked, pinned models (BAKE_MODELS=1), linux/amd64 only.
name: Release

on:
  push:
    branches: ["phase-*"]
    tags: ["phase-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a phase branch supersedes the previous -rc build; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # Models + CPU torch make the image several GB; the default runner disk is too tight.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Compute image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${OWNER,,}/trustbook"
          if [[ ! "$REF_NAME" =~ ^phase-([0-9]+[a-z]?)$ ]]; then
            echo "::error::'$REF_NAME' is not of the form phase-<N> or phase-<N><letter>"
            exit 1
          fi
          phase="phase-${BASH_REMATCH[1]}"
          if [[ "$REF_TYPE" == "branch" ]]; then
            version="${phase}-rc"
            tags="${image}:${version}"
          else
            version="${phase}"
            tags="${image}:${version},${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags=${tags}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local Docker engine first: the end-to-end test runs against this exact
      # image, and nothing is published unless it passes.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BAKE_MODELS=1
            TRUSTBOOK_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,mode=max,scope=release-app

      # SPEC §13: create space → paste text → ask → cited answer, with real bundled models and the
      # deterministic mock chat model (TRUSTBOOK_MOCK_LLM=1; never set in compose.yaml).
      - name: Start the image for the end-to-end test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="${TAGS%%,*}"
          mkdir -p "$RUNNER_TEMP/e2e-data" "$RUNNER_TEMP/e2e-home"
          docker run -d --name trustbook-e2e -p 8484:8484 \
            -e TRUSTBOOK_MOCK_LLM=1 -e TRUSTBOOK_SEARXNG_URL=http://127.0.0.1:9 \
            -v "$RUNNER_TEMP/e2e-data:/data" -v "$RUNNER_TEMP/e2e-home:/host:ro" "$image"
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' trustbook-e2e)"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          docker logs trustbook-e2e | tail -50
          exit 1

      # Phase 3b: the `trustbook` CLI inside the image, against the same app (D-092).
      - name: Run the CLI end-to-end test
        run: bash cli/e2e/cli_e2e.sh trustbook-e2e

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the end-to-end test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8484
          # The host folder mounted read-only at /host: specs write test folders (code, a planted
          # fake secret generated at runtime, a big tree for estimates) there before linking them.
          E2E_BROWSE_ROOT: ${{ runner.temp }}/e2e-home
        run: |
          npm install -g pnpm@10.34.6
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: End-to-end logs
        if: failure()
        run: docker logs trustbook-e2e 2>&1 | tail -200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker rm -f trustbook-e2e
          IFS=',' read -ra tag_list <<< "$TAGS"
          for tag in "${tag_list[@]}"; do docker push "$tag"; done

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            IFS=',' read -ra tag_list <<< "$TAGS"
            bt='`'
            printf -- "- ${bt}%s${bt}\n" "${tag_list[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
