# Release images (SPEC §14):
#   push to branch phase-N  -> ghcr.io/<owner>/trustbook:phase-N-rc
#   push of tag    phase-N  -> ghcr.io/<owner>/trustbook:phase-N and :latest
# Full image with baked, pinned models (BAKE_MODELS=1), linux/amd64 only.
name: Release

on:
  push:
    branches: ["phase-*"]
    tags: ["phase-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer push to a phase branch supersedes the previous -rc build; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  image:
    name: Build and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # Models + CPU torch make the image several GB; the default runner disk is too tight.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Compute image tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${OWNER,,}/trustbook"
          if [[ ! "$REF_NAME" =~ ^phase-([0-9]+)$ ]]; then
            echo "::error::'$REF_NAME' is not of the form phase-<N>"
            exit 1
          fi
          phase="phase-${BASH_REMATCH[1]}"
          if [[ "$REF_TYPE" == "branch" ]]; then
            version="${phase}-rc"
            tags="${image}:${version}"
          else
            version="${phase}"
            tags="${image}:${version},${image}:latest"
          fi
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "tags=${tags}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: ${tags}"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BAKE_MODELS=1
            TRUSTBOOK_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,mode=max,scope=release-app

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            IFS=',' read -ra tag_list <<< "$TAGS"
            bt='`'
            printf -- "- ${bt}%s${bt}\n" "${tag_list[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
