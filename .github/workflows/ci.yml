# CI (SPEC §13): lint, typecheck and tests with the mock LLM adapter, plus a Docker build check.
# No real endpoints and no network calls from tests.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PNPM_VERSION: "10.34.6"
  DO_NOT_TRACK: "1"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict app

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # pnpm is installed below with npm (not corepack); the store is cached separately.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install -g "pnpm@${PNPM_VERSION}"

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker build check (no models)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      # BAKE_MODELS=0 skips the ML extra and model download (DECISIONS D-006); release.yml builds the full image.
      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            BAKE_MODELS=0
            TRUSTBOOK_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app
