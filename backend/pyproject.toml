[project]
name = "trustbook"
version = "0.0.0"
description = "Trustbook - trust your notebook. Local-first grounded research notebook."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlmodel",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
ml = [
    "torch",
    "sentence-transformers",
    "transformers",
    "cactus-needle",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "types-PyYAML",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = [
    "S101",   # assert is fine in tests
    "S104",   # binding 0.0.0.0 is intended inside the container
    "S311",   # random is not used for security
    "S608",   # SQL is built only from internal constants
    "SIM114", # separate branches read better for field rules
    "SIM905", # word lists are clearer as one string
    "RUF001", "RUF002", "RUF003",  # the ellipsis character is intended in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "sentence_transformers", "sentence_transformers.*", "transformers", "transformers.*", "needle", "needle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
