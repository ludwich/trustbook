[project]
name = "trustbook-cli"
version = "0.1.0"
description = "Command line client for Trustbook: add sources and ask grounded questions over the HTTP API."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx",
]

[project.scripts]
trustbook = "trustbook_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustbook_cli"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = [
    "S101",   # assert is fine in tests
    "SIM114", # separate branches read better for field rules
    "RUF001", "RUF002", "RUF003",  # the ellipsis character is intended in user-facing text
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
